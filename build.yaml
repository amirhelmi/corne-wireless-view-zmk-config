# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Board target follows the ZMK v0.3 pin in config/west.yml, which still uses
# hardware model v1 -> `nice_nano_v2` (not the `nice_nano//zmk` HWMv2 name).
#
# Plain corne shields, NOT `nice_view_adapter nice_view`. This board has the
# 4-pin I2C header (GND/VCC/SCL/SDA) with an SSD1306 OLED, which the corne
# shield already describes: it chooses `zephyr,display = &oled` and defines
# `oled: ssd1306@3c` on `&pro_micro_i2c`. The nice_view_adapter overlay ends
# with `&pro_micro_i2c { status = "disabled"; }`, so adding those shields
# switched off the bus the display actually lives on and pointed the display
# at an ls0xx over SPI that is not physically present -- blank screen on both
# halves, with the firmware faithfully driving hardware that was not there.
# A real nice!view would also need a CS wire bodged to D1, which this board
# does not have.
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # Flash this to BOTH halves to wipe stale BLE bonds and split pairing.
  # Required whenever passkey entry or other BLE settings change.
  - board: nice_nano_v2
    shield: settings_reset
