# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Board target follows the ZMK v0.3 pin in config/west.yml, which still uses
# hardware model v1 -> `nice_nano_v2` (not the `nice_nano//zmk` HWMv2 name).
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    # TEMPORARY -- debug console on the left half while the nice!view is blank.
    # This snippet sets CONFIG_ZMK_USB_LOGGING and supplies both the
    # zephyr,cdc-acm-uart node and the zephyr,console chosen it needs.
    snippet: zmk-usb-logging
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
  # Flash this to BOTH halves to wipe stale BLE bonds and split pairing.
  # Required whenever passkey entry or other BLE settings change.
  - board: nice_nano_v2
    shield: settings_reset
