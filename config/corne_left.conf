# Left half is the split central: it holds one bond per host profile plus the
# bond to the right half, so it needs more connection/bond slots than a
# non-split board. 6 covers ZMK's five profiles + the peripheral.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

## TEMPORARY -- diagnosing the fully blank nice!view. Remove once resolved.
# Left half only, so the right half stays an unmodified control: if left renders
# and right does not, the custom nice_view widget is at fault; if both stay
# blank, the fault is below it in the ls0xx/SPI layer.
#
# CONFIG_ZMK_USB_LOGGING itself comes from the zmk-usb-logging snippet applied
# in build.yaml, not from here: it selects UART_INTERRUPT_DRIVEN, which needs a
# serial device (nice_nano.dtsi configures &uart0 but never sets status =
# "okay") plus a zephyr,console chosen. The snippet provides both via CDC ACM.
# Only the display log level is ours.
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
