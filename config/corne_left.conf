# Left half is the split central: it holds one bond per host profile plus the
# bond to the right half, so it needs more connection/bond slots than a
# non-split board. 6 covers ZMK's five profiles + the peripheral.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

## TEMPORARY -- diagnosing the fully blank nice!view. Remove once resolved.
# Left half only, so the right half stays an unmodified control: if left renders
# and right does not, the custom nice_view widget is at fault; if both stay
# blank, the fault is below it in the ls0xx/SPI layer.
#
# USB CDC ACM console, to surface display/ls0xx init failures at boot.
# ZMK_USB_LOGGING selects UART_INTERRUPT_DRIVEN, whose SERIAL_SUPPORT_INTERRUPT
# dependency nothing satisfies here -- nice_nano.dtsi configures &uart0 but
# never sets status = "okay". The studio-rpc-usb-uart snippet supplies the
# zephyr,cdc-acm-uart node that does, so build.yaml applies it to this half.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# Swap the custom nice_view widget for ZMK's built-in status screen. This is the
# discriminator: the built-in screen exercises the same ls0xx driver and LVGL
# pipeline but none of the nice_view canvas/font code.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
