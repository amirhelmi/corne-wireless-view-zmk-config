# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Required for the &mkp mouse-button bindings used by the click/back/forward combos
CONFIG_ZMK_POINTING=y

# nice!view screens. The nice_view shield only sets LVGL/display sub-options
# (buffer size, DPI, custom status screen); ZMK_DISPLAY itself has no default
# and must be turned on here, or both screens stay blank.
CONFIG_ZMK_DISPLAY=y

# Passkey entry during BLE pairing. Some Windows hosts -- work-managed and
# Enterprise ones in particular -- refuse "just works" pairing, and without
# this the keyboard cannot supply the passkey they ask for.
# NOTE: enabling this invalidates existing bonds; re-pair every host.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
