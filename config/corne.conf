##################
##  Main Config ##
##################

## Bluetooth Stability & Connection Management
# This block mirrors the Charybdis_Nano-Config settings, which pair and stay
# connected reliably on the same hosts.
CONFIG_ZMK_BLE=y

# Passkey entry during BLE pairing. Some Windows hosts -- work-managed and
# Enterprise ones in particular -- refuse "just works" pairing, and without
# this the keyboard cannot supply the passkey they ask for.
# NOTE: enabling this invalidates existing bonds; flash settings_reset to both
# halves and re-pair every host.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# TX power -- +4 dBm is plenty for desk range, +8 adds unnecessary 2.4GHz noise
# that can interfere with BT earphones
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Relaxed intervals to reduce lag when BT earphones are connected
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20

# BLE buffers -- headroom for typing data
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_RX_COUNT=8

# Force 1M PHY -- some Intel/Realtek adapters poorly negotiate 2M PHY
CONFIG_BT_CTLR_PHY_2M=n

# Disable problematic features for Windows/Intel/macOS chips
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

## Power Management
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

## Battery & Macros
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

## Mouse & Performance
# Required for the &mkp mouse-button bindings used by the click/back/forward combos
CONFIG_ZMK_POINTING=y

# Stack sizes -- headroom for BLE stability
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

## Display
# nice!view screens. The shield's own nice_view.conf already sets
# CONFIG_ZMK_DISPLAY=y and CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n, so this line is
# redundant -- kept only to make the intent explicit.
CONFIG_ZMK_DISPLAY=y

# nice_view forces ZMK_DISPLAY_WORK_QUEUE_DEDICATED. Its default 2048-byte
# stack is tight for the custom status widget (LVGL canvas + Montserrat 14/16/18
# + unscii-8 + WPM); an overflow kills the render thread and the screen stays
# blank while the keyboard otherwise works normally.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# LVGL heap. Defaults to 4096 for the custom status screen; a failed allocation
# there also shows up as a permanently blank screen. RAM was at 40% before this.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
